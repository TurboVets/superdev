<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperDev</title>
    <meta name="description" content="Issue to ship. Before the PR exists." />
    <meta property="og:title" content="SuperDev" />
    <meta
      property="og:description"
      content="Issue to ship. Before the PR exists."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050403'/%3E%3Cpath d='M8 20c0-6 3-10 8-10s8 4 8 10v2H8z' fill='none' stroke='%23e3a85a'/%3E%3Crect x='11' y='16' width='10' height='2' fill='%23ffd089'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #050403;
        --paper: #f4ead4;
        --mute: #8a8170;
        --copper: #e3a85a;
        --hot: #ffd089;
        --line: rgba(244, 234, 212, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
      }
      body {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.86rem;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.95rem 1.3rem;
        background: linear-gradient(180deg, rgba(5, 4, 3, 0.8), transparent);
      }
      header a:hover {
        color: var(--copper);
      }
      .stage {
        min-height: 100svh;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
      }
      .field {
        position: relative;
        min-height: 100svh;
        background:
          radial-gradient(
            ellipse at 50% 72%,
            rgba(227, 168, 90, 0.08),
            transparent 52%
          ),
          var(--ink);
      }
      .field canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .status {
        position: absolute;
        left: 1.3rem;
        bottom: 1.3rem;
        z-index: 2;
        margin: 0;
        color: var(--copper);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.68rem;
      }
      .console {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 5.5rem 1.4rem 2.2rem;
        gap: 1.3rem;
      }
      h1 {
        margin: 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-style: italic;
        font-size: clamp(3.6rem, 8vw, 6.4rem);
        line-height: 0.82;
        letter-spacing: -0.04em;
      }
      .lede {
        margin: 0.35rem 0 0;
        color: var(--mute);
        font-size: 0.8rem;
      }
      .panel {
        border: 1px solid var(--line);
        background: rgba(8, 6, 4, 0.72);
        padding: 0.9rem 1rem 1rem;
      }
      .panel h2 {
        margin: 0 0 0.7rem;
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--copper);
      }
      .picks,
      .levels {
        display: grid;
        gap: 0.4rem;
      }
      .pick,
      .level {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.7rem 0.85rem;
        align-items: baseline;
        width: 100%;
        text-align: left;
        padding: 0.7rem 0.75rem;
        border: 1px solid transparent;
        background: #0d0b08;
        cursor: pointer;
      }
      .pick b,
      .level b {
        color: var(--copper);
        font-weight: 500;
      }
      .pick span,
      .level span {
        color: var(--mute);
      }
      .pick[aria-pressed="true"],
      .level[aria-pressed="true"] {
        border-color: var(--copper);
        background: rgba(227, 168, 90, 0.08);
      }
      .pick:hover,
      .level:hover {
        border-color: rgba(227, 168, 90, 0.45);
      }
      .pick:focus-visible,
      .level:focus-visible,
      .btn:focus-visible,
      header a:focus-visible {
        outline: 2px solid var(--copper);
        outline-offset: 2px;
      }
      .levels {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .level {
        grid-template-columns: 1fr;
      }
      .level b {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 1.35rem;
      }
      .orders {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .orders li {
        display: grid;
        grid-template-columns: 3.2rem 1fr auto;
        gap: 0.7rem;
        padding: 0.55rem 0;
        border-top: 1px solid var(--line);
      }
      .orders li:first-child {
        border-top: 0;
      }
      .orders em {
        font-style: normal;
        color: var(--copper);
      }
      .orders .go {
        color: var(--hot);
      }
      .orders .skip {
        color: #5c564a;
      }
      .why {
        margin: 0.7rem 0 0;
        color: var(--mute);
        min-height: 2.6em;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .btn {
        min-height: 2.5rem;
        padding: 0 1rem;
        border: 0;
        background: var(--copper);
        color: #1a1208;
        cursor: pointer;
      }
      .btn.ghost {
        background: transparent;
        color: var(--paper);
        border: 1px solid var(--line);
      }
      .cmd {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
        color: #e6d3a8;
        overflow-x: auto;
      }
      .cmd code {
        white-space: nowrap;
      }
      .cmd button {
        flex: none;
        border: 0;
        background: none;
        color: var(--copper);
        cursor: pointer;
      }
      footer {
        display: flex;
        justify-content: space-between;
        color: var(--mute);
      }
      @media (max-width: 860px) {
        .stage {
          grid-template-columns: 1fr;
        }
        .field {
          min-height: 56svh;
        }
        .console {
          padding: 1rem 1.2rem 1.6rem;
        }
        .levels {
          grid-template-columns: 1fr;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .status {
          letter-spacing: 0.08em;
        }
      }
    </style>
  </head>
  <body data-level="standard">
    <header>
      <a href="./">SuperDev</a>
      <a href="https://github.com/TurboVets/superdev">GitHub</a>
    </header>

    <main class="stage">
      <div class="field">
        <canvas
          id="field"
          role="img"
          aria-label="SuperDev soldier. Animation matches the selected intensity."
        ></canvas>
        <p class="status" id="status" aria-live="polite">Advance</p>
      </div>

      <div class="console">
        <div>
          <h1>SuperDev</h1>
          <p class="lede">Reads the diff. Issues orders. Then moves.</p>
        </div>

        <section class="panel">
          <h2>The change</h2>
          <div class="picks" role="group" aria-label="Sample change">
            <button
              type="button"
              class="pick"
              data-file="aria"
              aria-pressed="false"
            >
              <b>docs / aria</b>
              <span>button.component.html · aria-label</span>
            </button>
            <button
              type="button"
              class="pick"
              data-file="logic"
              aria-pressed="true"
            >
              <b>logic</b>
              <span>claim-form.ts · default path</span>
            </button>
            <button
              type="button"
              class="pick"
              data-file="guard"
              aria-pressed="false"
            >
              <b>authz</b>
              <span>session.guard.ts · CanActivate</span>
            </button>
          </div>
        </section>

        <section class="panel">
          <h2>Intensity</h2>
          <div class="levels" role="group" aria-label="Intensity">
            <button
              type="button"
              class="level"
              data-level="lite"
              aria-pressed="false"
            >
              <b>lite</b>
              <span>patrol</span>
            </button>
            <button
              type="button"
              class="level"
              data-level="standard"
              aria-pressed="true"
            >
              <b>standard</b>
              <span>advance</span>
            </button>
            <button
              type="button"
              class="level"
              data-level="full"
              aria-pressed="false"
            >
              <b>full</b>
              <span>engage</span>
            </button>
          </div>
          <p class="why" id="why" aria-live="polite"></p>
        </section>

        <section class="panel">
          <h2>Orders</h2>
          <ol class="orders" id="orders" aria-live="polite"></ol>
        </section>

        <div class="actions">
          <a class="btn" href="https://github.com/TurboVets/superdev">Clone</a>
          <button type="button" class="btn ghost" id="copy-hero">
            Copy install
          </button>
        </div>
        <div class="cmd">
          <code id="install"></code>
          <button type="button" id="copy">Copy</button>
        </div>
        <footer>
          <span>TurboVets</span>
          <a href="https://github.com/TurboVets/superdev">Source</a>
        </footer>
      </div>
    </main>

    <script>
      const INSTALL =
        "git clone https://github.com/TurboVets/superdev.git && ./install.sh";
      document.getElementById("install").textContent = INSTALL;

      const FILES = {
        aria: {
          level: "lite",
          why: "docs/CSS/aria only. Title “quick fix” is ignored. This is lite.",
        },
        logic: {
          level: "standard",
          why: "Default logic change. Not a guard. Not an aria-label.",
        },
        guard: {
          level: "full",
          why: "session.guard.ts + CanActivate. One file can still be full.",
        },
      };
      const ORDERS = {
        lite: [
          ["L1", "One pass. Docs may skip.", "go"],
          ["L3", "Skip local bots.", "skip"],
          ["6a", "Click the one control.", "go"],
          ["6b", "Skip if aria or docs.", "skip"],
        ],
        standard: [
          ["L1", "Audit twice. Same SHA.", "go"],
          ["L3", "Local bots. Required.", "go"],
          ["6a", "Click every claimed surface.", "go"],
          ["6b", "One clip. Hold it.", "go"],
        ],
        full: [
          ["L1", "Twice, then stability.", "go"],
          ["L3", "Local bots. Required.", "go"],
          ["6a", "Both parties. No leftovers.", "go"],
          ["6b", "Both sides. Hold both.", "go"],
        ],
      };
      const MOVE = { lite: "Patrol", standard: "Advance", full: "Engage" };

      const whyEl = document.getElementById("why");
      const ordersEl = document.getElementById("orders");
      const statusEl = document.getElementById("status");
      let level = "standard";
      let file = "logic";

      function renderOrders(next) {
        ordersEl.replaceChildren(
          ...ORDERS[next].map(([code, text, kind]) => {
            const li = document.createElement("li");
            const em = document.createElement("em");
            em.textContent = code;
            const span = document.createElement("span");
            span.textContent = text;
            const mark = document.createElement("b");
            mark.className = kind;
            mark.textContent = kind === "skip" ? "skip" : "run";
            li.append(em, span, mark);
            return li;
          }),
        );
      }

      function setLevel(next, reason) {
        level = next;
        document.body.dataset.level = next;
        statusEl.textContent = MOVE[next];
        document.querySelectorAll(".level").forEach((el) => {
          el.setAttribute("aria-pressed", String(el.dataset.level === next));
        });
        whyEl.textContent = reason || FILES[file].why;
        renderOrders(next);
      }

      function setFile(next) {
        file = next;
        document.querySelectorAll(".pick").forEach((el) => {
          el.setAttribute("aria-pressed", String(el.dataset.file === next));
        });
        setLevel(FILES[next].level, FILES[next].why);
      }

      document.querySelectorAll(".pick").forEach((el) => {
        el.addEventListener("click", () => setFile(el.dataset.file));
      });
      document.querySelectorAll(".level").forEach((el) => {
        el.addEventListener("click", () => {
          const next = el.dataset.level;
          setLevel(
            next,
            FILES[file].level !== next
              ? "Override. The diff wanted " + FILES[file].level + "."
              : FILES[file].why,
          );
        });
      });

      async function copyInstall(btn) {
        try {
          await navigator.clipboard.writeText(INSTALL);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = INSTALL;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        const label = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => (btn.textContent = label), 1400);
      }
      document
        .getElementById("copy")
        .addEventListener("click", (e) => copyInstall(e.currentTarget));
      document
        .getElementById("copy-hero")
        .addEventListener("click", (e) => copyInstall(e.currentTarget));
      setFile("logic");

      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const canvas = document.getElementById("field");
      const ctx = canvas.getContext("2d");
      const NODES = ["0", "1", "2", "3", "4", "5", "5.5", "6a", "6b", "7"];
      const dust = Array.from({ length: 18 }, (_, i) => ({
        a: i * 0.7,
        r: 0.2 + (i % 5) * 0.12,
      }));
      let w = 0,
        h = 0,
        t = 0;

      function resize() {
        const r = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = r.width;
        h = r.height;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      addEventListener("resize", resize);

      function bone(ax, ay, bx, by, thick) {
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.lineTo(bx, by);
        ctx.lineWidth = thick;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      }

      function down(from, angle, len) {
        return {
          x: from.x + Math.sin(angle) * len,
          y: from.y - Math.cos(angle) * len,
        };
      }

      function drawSoldier(mode, time) {
        const speed = mode === "full" ? 9 : mode === "standard" ? 5.2 : 2.1;
        const swing = mode === "full" ? 0.7 : mode === "standard" ? 0.42 : 0.18;
        const lean = mode === "full" ? 0.16 : mode === "standard" ? 0.07 : 0.02;
        const phase = reduced ? 0.35 : time * speed;
        const fire = !reduced && mode === "full" && Math.sin(time * 14) > 0.5;
        const bob = reduced ? 0 : Math.abs(Math.sin(phase)) * (mode === "lite" ? 4 : 9);
        const unit = Math.min(w, h) * 0.00155;
        const ground = h * 0.8;
        const cx = w * 0.52;

        ctx.save();
        ctx.translate(cx, ground - bob);
        ctx.scale(unit, -unit);

        ctx.fillStyle = "rgba(227,168,90,0.1)";
        ctx.beginPath();
        ctx.ellipse(0, 4, 90, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#e3a85a";
        ctx.fillStyle = "#100c08";
        ctx.shadowColor = "#e3a85a";
        ctx.shadowBlur = mode === "full" ? 16 : 7;

        const hip = { x: lean * 30, y: 108 };
        const neck = { x: hip.x + lean * 40, y: 188 };
        const shL = { x: neck.x - 28, y: 176 };
        const shR = { x: neck.x + 26, y: 174 };
        const lThigh = Math.sin(phase) * swing;
        const rThigh = Math.sin(phase + Math.PI) * swing;
        const lKneeA = 0.35 + Math.max(0, -Math.cos(phase)) * 0.55;
        const rKneeA = 0.35 + Math.max(0, -Math.cos(phase + Math.PI)) * 0.55;
        const lHip = { x: hip.x - 12, y: hip.y };
        const rHip = { x: hip.x + 12, y: hip.y };
        const lKnee = down(lHip, lThigh, 52);
        const rKnee = down(rHip, rThigh, 52);
        const lFoot = down(lKnee, lThigh + lKneeA, 50);
        const rFoot = down(rKnee, rThigh + rKneeA, 50);
        const lArm = Math.sin(phase + Math.PI) * swing * 0.65;
        const lElb = down(shL, 0.85 + lArm, 40);
        const lHand = down(lElb, 1.15 + lArm * 0.4, 36);
        const aim = mode === "full" ? 1.45 : mode === "standard" ? 1.2 : 0.85;
        const rElb = down(shR, aim, 38);
        const rHand = down(rElb, aim + 0.15, 34);

        bone(lHip.x, lHip.y, lKnee.x, lKnee.y, 14);
        bone(lKnee.x, lKnee.y, lFoot.x, lFoot.y, 12);
        bone(shL.x, shL.y, lElb.x, lElb.y, 11);
        bone(lElb.x, lElb.y, lHand.x, lHand.y, 9);

        ctx.beginPath();
        ctx.moveTo(hip.x - 22, hip.y);
        ctx.lineTo(neck.x - 24, neck.y - 8);
        ctx.lineTo(neck.x + 24, neck.y - 8);
        ctx.lineTo(hip.x + 22, hip.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(shL.x, shL.y, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(shR.x, shR.y, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(neck.x + 4, 214, 22, 24, lean, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = mode === "full" ? "#ffd089" : "#e3a85a";
        ctx.globalAlpha = 0.7 + Math.sin(time * 5) * 0.2;
        ctx.fillRect(neck.x - 10, 208, 24, 6);
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#100c08";

        bone(rHip.x, rHip.y, rKnee.x, rKnee.y, 14);
        bone(rKnee.x, rKnee.y, rFoot.x, rFoot.y, 12);
        bone(shR.x, shR.y, rElb.x, rElb.y, 11);
        bone(rElb.x, rElb.y, rHand.x, rHand.y, 9);

        ctx.save();
        ctx.translate(rHand.x - (fire ? 8 : 0), rHand.y);
        ctx.rotate(mode === "full" ? 0.05 : -0.15);
        ctx.beginPath();
        ctx.rect(-6, -7, 108, 12);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.rect(22, 5, 12, 16);
        ctx.fill();
        ctx.stroke();
        if (fire) {
          ctx.shadowBlur = 28;
          ctx.fillStyle = "#ffd089";
          ctx.beginPath();
          ctx.moveTo(108, 0);
          ctx.lineTo(148, -14);
          ctx.lineTo(132, 0);
          ctx.lineTo(148, 14);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        ctx.beginPath();
        ctx.ellipse(lFoot.x + 10, lFoot.y - 2, 18, 6, 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(rFoot.x + 10, rFoot.y - 2, 18, 6, 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        if (mode === "full" && !reduced) {
          dust.forEach((d) => {
            const x = cx - 30 - ((time * 90 + d.a * 50) % 180);
            ctx.fillStyle = "rgba(227,168,90,0.25)";
            ctx.fillRect(x, ground + Math.sin(time * 9 + d.a) * 3, 3, 1.4);
          });
        }
      }

      function drawHud(mode, time) {
        const cx = w * 0.5;
        const cy = h * 0.38;
        const rx = Math.min(w, h) * 0.38;
        const ry = rx * 0.36;
        const hot = mode === "full" ? 1 : mode === "standard" ? 0.55 : 0.28;
        const shown =
          mode === "lite" ? NODES.filter((_, i) => i % 3 === 0) : NODES;
        ctx.strokeStyle = "rgba(227,168,90," + (0.16 + hot * 0.18) + ")";
        ctx.lineWidth = 1;
        ctx.setLineDash(mode === "lite" ? [2, 16] : [16, 12]);
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, time * 0.05, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = "rgba(255,208,137," + (0.35 + hot * 0.45) + ")";
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, time * 0.05, time, time + 0.7);
        ctx.stroke();
        shown.forEach((label, i) => {
          const a = (i / shown.length) * Math.PI * 2 + time * 0.05;
          ctx.fillStyle = "#e3a85a";
          ctx.beginPath();
          ctx.arc(
            cx + Math.cos(a) * rx,
            cy + Math.sin(a) * ry,
            2,
            0,
            Math.PI * 2,
          );
          ctx.fill();
          ctx.font = "500 10px 'IBM Plex Mono', monospace";
          ctx.fillStyle = "rgba(244,234,212,0.45)";
          ctx.fillText(
            label,
            cx + Math.cos(a) * rx + 6,
            cy + Math.sin(a) * ry - 6,
          );
        });
      }

      function frame() {
        ctx.clearRect(0, 0, w, h);
        drawHud(level, t);
        drawSoldier(level, t);
        if (!reduced) {
          t += 0.016;
          requestAnimationFrame(frame);
        } else {
          drawSoldier(level, 0.4);
        }
      }
      frame();
    </script>
  </body>
</html>
