<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperDev</title>
    <meta name="description" content="Issue to ship. Before the PR exists." />
    <meta property="og:title" content="SuperDev" />
    <meta
      property="og:description"
      content="Issue to ship. Before the PR exists."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://superdev-mocha.vercel.app/plates/soldier-hero.png"
    />
    <link rel="icon" href="plates/soldier-mark.png" type="image/png" />
    <link rel="preload" as="image" href="plates/soldier-hero.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #050403;
        --paper: #f4ead4;
        --mute: #8a8170;
        --copper: #e3a85a;
        --hot: #ffd089;
        --line: rgba(244, 234, 212, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
      }
      body {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.86rem;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        opacity: 0.1;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.95rem 1.3rem;
        background: linear-gradient(180deg, rgba(5, 4, 3, 0.8), transparent);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
      }
      .brand img {
        width: 22px;
        height: 22px;
        object-fit: cover;
        border-radius: 50%;
      }
      header a:hover {
        color: var(--copper);
      }
      .stage {
        min-height: 100svh;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        align-items: stretch;
      }
      .soldier {
        position: relative;
        min-height: 100svh;
      }
      .soldier img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
        transition: filter 0.5s ease;
      }
      body[data-level="lite"] .soldier img {
        filter: grayscale(0.35) brightness(0.86);
      }
      body[data-level="standard"] .soldier img {
        filter: saturate(1.05);
      }
      body[data-level="full"] .soldier img {
        filter: saturate(1.2) drop-shadow(0 0 28px rgba(227, 168, 90, 0.35));
      }
      .soldier canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .console {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 5.5rem 1.4rem 2.2rem;
        gap: 1.4rem;
      }
      h1 {
        margin: 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-style: italic;
        font-size: clamp(3.6rem, 8vw, 6.4rem);
        line-height: 0.82;
        letter-spacing: -0.04em;
      }
      .lede {
        margin: 0.35rem 0 0;
        color: var(--mute);
        font-size: 0.8rem;
      }
      .panel {
        border: 1px solid var(--line);
        background: rgba(8, 6, 4, 0.72);
        padding: 0.9rem 1rem 1rem;
      }
      .panel h2 {
        margin: 0 0 0.7rem;
        font-size: 0.68rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--copper);
      }
      .picks,
      .levels {
        display: grid;
        gap: 0.4rem;
      }
      .picks {
        grid-template-columns: 1fr;
      }
      .pick,
      .level {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.7rem 0.85rem;
        align-items: baseline;
        width: 100%;
        text-align: left;
        padding: 0.7rem 0.75rem;
        border: 1px solid transparent;
        background: #0d0b08;
        cursor: pointer;
      }
      .pick b,
      .level b {
        color: var(--copper);
        font-weight: 500;
      }
      .pick span,
      .level span {
        color: var(--mute);
      }
      .pick[aria-pressed="true"],
      .level[aria-pressed="true"] {
        border-color: var(--copper);
        background: rgba(227, 168, 90, 0.08);
      }
      .pick:hover,
      .level:hover {
        border-color: rgba(227, 168, 90, 0.45);
      }
      .pick:focus-visible,
      .level:focus-visible,
      .btn:focus-visible,
      header a:focus-visible {
        outline: 2px solid var(--copper);
        outline-offset: 2px;
      }
      .levels {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .level {
        grid-template-columns: 1fr;
      }
      .level b {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 1.35rem;
        text-transform: lowercase;
      }
      .orders {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .orders li {
        display: grid;
        grid-template-columns: 3.2rem 1fr auto;
        gap: 0.7rem;
        padding: 0.55rem 0;
        border-top: 1px solid var(--line);
        align-items: baseline;
      }
      .orders li:first-child {
        border-top: 0;
      }
      .orders em {
        font-style: normal;
        color: var(--copper);
      }
      .orders .go {
        color: var(--hot);
      }
      .orders .skip {
        color: #5c564a;
      }
      .why {
        margin: 0.7rem 0 0;
        color: var(--mute);
        min-height: 2.6em;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .btn {
        min-height: 2.5rem;
        padding: 0 1rem;
        border: 0;
        background: var(--copper);
        color: #1a1208;
        cursor: pointer;
      }
      .btn.ghost {
        background: transparent;
        color: var(--paper);
        border: 1px solid var(--line);
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .cmd {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
        color: #e6d3a8;
        overflow-x: auto;
      }
      .cmd code {
        white-space: nowrap;
      }
      .cmd button {
        flex: none;
        border: 0;
        background: none;
        color: var(--copper);
        cursor: pointer;
      }
      footer {
        display: flex;
        justify-content: space-between;
        color: var(--mute);
        padding-bottom: 0.2rem;
      }
      @media (max-width: 860px) {
        .stage {
          grid-template-columns: 1fr;
        }
        .soldier {
          min-height: 58svh;
        }
        .console {
          padding: 1rem 1.2rem 1.6rem;
        }
        .levels {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-level="standard">
    <header>
      <a class="brand" href="./">
        <img src="plates/soldier-mark.png" alt="" width="22" height="22" />
        SuperDev
      </a>
      <a href="https://github.com/TurboVets/superdev">GitHub</a>
    </header>

    <main class="stage">
      <div class="soldier">
        <img
          src="plates/soldier-hero.png"
          alt="SuperDev as an AI soldier, standing ready."
          width="1024"
          height="1365"
        />
        <canvas id="hud" aria-hidden="true"></canvas>
      </div>

      <div class="console">
        <div>
          <h1>SuperDev</h1>
          <p class="lede">Reads the diff. Issues orders. Then ships.</p>
        </div>

        <section class="panel">
          <h2>The change</h2>
          <div class="picks" role="group" aria-label="Sample change">
            <button
              type="button"
              class="pick"
              data-file="aria"
              aria-pressed="false"
            >
              <b>docs / aria</b>
              <span>button.component.html · aria-label</span>
            </button>
            <button
              type="button"
              class="pick"
              data-file="logic"
              aria-pressed="true"
            >
              <b>logic</b>
              <span>claim-form.ts · default path</span>
            </button>
            <button
              type="button"
              class="pick"
              data-file="guard"
              aria-pressed="false"
            >
              <b>authz</b>
              <span>session.guard.ts · CanActivate</span>
            </button>
          </div>
        </section>

        <section class="panel">
          <h2>Intensity</h2>
          <div class="levels" role="group" aria-label="Intensity">
            <button
              type="button"
              class="level"
              data-level="lite"
              aria-pressed="false"
            >
              <b>lite</b>
              <span>one control</span>
            </button>
            <button
              type="button"
              class="level"
              data-level="standard"
              aria-pressed="true"
            >
              <b>standard</b>
              <span>claimed surfaces</span>
            </button>
            <button
              type="button"
              class="level"
              data-level="full"
              aria-pressed="false"
            >
              <b>full</b>
              <span>both sides</span>
            </button>
          </div>
          <p class="why" id="why" aria-live="polite"></p>
        </section>

        <section class="panel">
          <h2>Orders</h2>
          <ol class="orders" id="orders" aria-live="polite"></ol>
        </section>

        <div class="actions">
          <a class="btn" href="https://github.com/TurboVets/superdev">Clone</a>
          <button type="button" class="btn ghost" id="copy-hero">
            Copy install
          </button>
        </div>

        <div class="cmd">
          <code id="install"></code>
          <button type="button" id="copy">Copy</button>
        </div>
        <footer>
          <span>TurboVets</span>
          <a href="https://github.com/TurboVets/superdev">Source</a>
        </footer>
      </div>
    </main>

    <script>
      const INSTALL =
        "git clone https://github.com/TurboVets/superdev.git && ./install.sh";
      document.getElementById("install").textContent = INSTALL;

      const FILES = {
        aria: {
          level: "lite",
          why: "docs/CSS/aria only. Title “quick fix” is ignored. This is lite.",
        },
        logic: {
          level: "standard",
          why: "Default logic change. Not a guard. Not an aria-label.",
        },
        guard: {
          level: "full",
          why: "session.guard.ts + CanActivate. One file can still be full.",
        },
      };

      const ORDERS = {
        lite: [
          ["L1", "One pass. Docs may skip.", "go"],
          ["L3", "Skip local bots.", "skip"],
          ["6a", "Click the one control.", "go"],
          ["6b", "Skip if aria or docs.", "skip"],
        ],
        standard: [
          ["L1", "Audit twice. Same SHA.", "go"],
          ["L3", "Local bots. Required.", "go"],
          ["6a", "Click every claimed surface.", "go"],
          ["6b", "One clip. Hold it.", "go"],
        ],
        full: [
          ["L1", "Twice, then stability.", "go"],
          ["L3", "Local bots. Required.", "go"],
          ["6a", "Both parties. No leftovers.", "go"],
          ["6b", "Both sides. Hold both.", "go"],
        ],
      };

      const whyEl = document.getElementById("why");
      const ordersEl = document.getElementById("orders");
      let level = "standard";
      let file = "logic";

      function renderOrders(next) {
        ordersEl.replaceChildren(
          ...ORDERS[next].map(([code, text, kind]) => {
            const li = document.createElement("li");
            const em = document.createElement("em");
            em.textContent = code;
            const span = document.createElement("span");
            span.textContent = text;
            const mark = document.createElement("b");
            mark.className = kind;
            mark.textContent = kind === "skip" ? "skip" : "run";
            li.append(em, span, mark);
            return li;
          }),
        );
      }

      function setLevel(next, reason) {
        level = next;
        document.body.dataset.level = next;
        document.querySelectorAll(".level").forEach((el) => {
          el.setAttribute("aria-pressed", String(el.dataset.level === next));
        });
        whyEl.textContent = reason || FILES[file].why;
        renderOrders(next);
      }

      function setFile(next) {
        file = next;
        document.querySelectorAll(".pick").forEach((el) => {
          el.setAttribute("aria-pressed", String(el.dataset.file === next));
        });
        setLevel(FILES[next].level, FILES[next].why);
      }

      document.querySelectorAll(".pick").forEach((el) => {
        el.addEventListener("click", () => setFile(el.dataset.file));
      });
      document.querySelectorAll(".level").forEach((el) => {
        el.addEventListener("click", () => {
          const next = el.dataset.level;
          const forced = FILES[file].level !== next;
          setLevel(
            next,
            forced
              ? "Override. The diff wanted " + FILES[file].level + "."
              : FILES[file].why,
          );
        });
      });

      async function copyInstall(btn) {
        try {
          await navigator.clipboard.writeText(INSTALL);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = INSTALL;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        const label = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => {
          btn.textContent = label;
        }, 1400);
      }
      document
        .getElementById("copy")
        .addEventListener("click", (e) => copyInstall(e.currentTarget));
      document
        .getElementById("copy-hero")
        .addEventListener("click", (e) => copyInstall(e.currentTarget));

      setFile("logic");

      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const canvas = document.getElementById("hud");
      const ctx = canvas.getContext("2d");
      const NODES = ["0", "1", "2", "3", "4", "5", "5.5", "6a", "6b", "7"];
      let w = 0,
        h = 0,
        t = 0;
      function resize() {
        const r = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = r.width;
        h = r.height;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      addEventListener("resize", resize);

      function frame() {
        ctx.clearRect(0, 0, w, h);
        const cx = w * 0.5;
        const cy = h * 0.42;
        const rx = Math.min(w, h) * 0.34;
        const ry = rx * 0.38;
        const hot = level === "full" ? 1 : level === "standard" ? 0.55 : 0.28;
        const shown =
          level === "lite" ? NODES.filter((_, i) => i % 3 === 0) : NODES;
        ctx.strokeStyle = "rgba(227,168,90," + (0.18 + hot * 0.2) + ")";
        ctx.lineWidth = level === "full" ? 1.6 : 1;
        ctx.setLineDash(level === "lite" ? [2, 16] : [14, 12]);
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, t * (0.04 + hot * 0.08), 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = "rgba(255,208,137," + (0.4 + hot * 0.5) + ")";
        ctx.shadowColor = "#e3a85a";
        ctx.shadowBlur = level === "full" ? 18 : 8;
        ctx.beginPath();
        ctx.ellipse(
          cx,
          cy,
          rx,
          ry,
          t * 0.08,
          t,
          t + (level === "lite" ? 0.35 : 0.8),
        );
        ctx.stroke();
        ctx.shadowBlur = 0;
        shown.forEach((label, i) => {
          const a = (i / shown.length) * Math.PI * 2 + t * 0.08;
          const x = cx + Math.cos(a) * rx;
          const y = cy + Math.sin(a) * ry;
          ctx.fillStyle = "#e3a85a";
          ctx.beginPath();
          ctx.arc(x, y, level === "full" ? 2.6 : 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.font = "500 10px 'IBM Plex Mono', monospace";
          ctx.fillStyle = "rgba(244,234,212,0.55)";
          ctx.fillText(label, x + 6, y - 6);
        });
        if (!reduced) {
          t += 0.008;
          requestAnimationFrame(frame);
        }
      }
      frame();
    </script>
  </body>
</html>
