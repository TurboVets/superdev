<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperDev</title>
    <meta name="description" content="Issue to ship. Before the PR exists." />
    <meta property="og:title" content="SuperDev" />
    <meta
      property="og:description"
      content="Issue to ship. Before the PR exists."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050403'/%3E%3Cpath d='M8 20c0-6 3-10 8-10s8 4 8 10v2H8z' fill='none' stroke='%23e3a85a'/%3E%3Crect x='11' y='16' width='10' height='2' fill='%23ffd089'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #050403;
        --paper: #f4ead4;
        --mute: #8a8170;
        --copper: #e3a85a;
        --hot: #ffd089;
        --line: rgba(244, 234, 212, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
      }
      body {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.86rem;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        padding: 0.95rem 1.3rem;
        background: linear-gradient(180deg, rgba(5, 4, 3, 0.85), transparent);
      }
      header a:hover {
        color: var(--copper);
      }
      .stage {
        min-height: 100svh;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .field {
        position: sticky;
        top: 0;
        height: 100svh;
        background:
          radial-gradient(
            ellipse at 42% 78%,
            rgba(227, 168, 90, 0.14),
            transparent 48%
          ),
          var(--ink);
      }
      .field canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .caption {
        position: absolute;
        left: 1.2rem;
        right: 1.2rem;
        bottom: 1.2rem;
        z-index: 2;
        min-height: 5.2rem;
        padding: 0.85rem 1rem;
        border: 1px solid var(--line);
        background: rgba(5, 4, 3, 0.78);
      }
      .caption b {
        display: block;
        color: var(--copper);
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 0.35rem;
      }
      .caption p {
        margin: 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 1.28rem;
        line-height: 1.28;
      }
      .console {
        padding: 5.2rem 1.4rem 2.2rem;
        display: grid;
        gap: 0.85rem;
      }
      h1 {
        margin: 0;
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-style: italic;
        font-size: clamp(3.4rem, 7vw, 5.8rem);
        line-height: 0.84;
      }
      .lede {
        margin: 0.45rem 0 0;
        color: var(--mute);
        max-width: 36rem;
      }
      .tour {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
        align-items: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.4rem;
        padding: 0 0.95rem;
        border: 1px solid transparent;
        background: var(--copper);
        color: #1a1208;
        line-height: 1;
        cursor: pointer;
      }
      a.btn {
        color: #1a1208;
      }
      .btn.ghost {
        background: transparent;
        color: var(--paper);
        border-color: var(--line);
      }
      .btn[aria-pressed="true"] {
        border-color: var(--copper);
        color: var(--copper);
      }
      .btn.live {
        animation: pulse 1.7s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(227, 168, 90, 0.5);
        }
        50% {
          box-shadow: 0 0 0 12px rgba(227, 168, 90, 0);
        }
      }
      .prog {
        color: var(--mute);
        font-size: 0.75rem;
      }
      .feat {
        border: 1px solid var(--line);
        background: #0b0907;
      }
      .feat > button {
        width: 100%;
        display: grid;
        grid-template-columns: 2.2rem 1fr auto;
        gap: 0.7rem;
        align-items: baseline;
        text-align: left;
        padding: 0.85rem 0.95rem;
        border: 0;
        background: none;
        cursor: pointer;
      }
      .feat > button em {
        font-style: normal;
        color: var(--copper);
      }
      .feat > button strong {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
        font-size: 1.35rem;
      }
      .feat > button span {
        color: var(--mute);
      }
      .feat[data-open="true"] {
        border-color: var(--copper);
      }
      .body {
        display: none;
        padding: 0 0.95rem 1.05rem 3.85rem;
        color: var(--paper);
        line-height: 1.55;
      }
      .feat[data-open="true"] .body {
        display: block;
        animation: rise 0.28s ease;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .body p {
        margin: 0 0 0.55rem;
      }
      .body p:last-child {
        margin-bottom: 0;
        color: var(--mute);
      }
      .panel {
        border: 1px solid var(--line);
        padding: 0.85rem 0.95rem;
      }
      .panel h2 {
        margin: 0 0 0.65rem;
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--copper);
        font-weight: 500;
      }
      .picks,
      .levels {
        display: grid;
        gap: 0.35rem;
      }
      .levels {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .pick,
      .level {
        width: 100%;
        text-align: left;
        padding: 0.65rem 0.7rem;
        border: 1px solid transparent;
        background: #0d0b08;
        cursor: pointer;
      }
      .pick[aria-pressed="true"],
      .level[aria-pressed="true"] {
        border-color: var(--copper);
      }
      .pick b,
      .level b {
        color: var(--copper);
      }
      .pick span,
      .level span {
        color: var(--mute);
        display: block;
      }
      .level b {
        font-family: "Instrument Serif", Georgia, serif;
        font-style: italic;
        font-size: 1.2rem;
      }
      .orders {
        list-style: none;
        margin: 0.4rem 0 0;
        padding: 0;
      }
      .orders li {
        display: grid;
        grid-template-columns: 3rem 1fr auto;
        gap: 0.55rem;
        padding: 0.4rem 0;
        border-top: 1px solid var(--line);
      }
      .why {
        margin: 0.55rem 0 0;
        color: var(--mute);
      }
      .go {
        color: var(--hot);
      }
      .skip {
        color: #5c564a;
      }
      .cmd {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        color: #e6d3a8;
        overflow-x: auto;
      }
      .cmd button {
        border: 0;
        background: none;
        color: var(--copper);
        cursor: pointer;
      }
      footer {
        display: flex;
        justify-content: space-between;
        color: var(--mute);
      }
      :focus-visible {
        outline: 2px solid var(--copper);
        outline-offset: 2px;
      }
      @media (max-width: 900px) {
        .stage {
          grid-template-columns: 1fr;
        }
        .field {
          position: relative;
          height: 52svh;
        }
        .console {
          padding: 1rem 1.15rem 1.8rem;
        }
        .levels {
          grid-template-columns: 1fr;
        }
        .feat > button {
          grid-template-columns: 2rem 1fr;
        }
        .feat > button span {
          display: none;
        }
        .body {
          padding-left: 0.95rem;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .btn.live,
        .feat[data-open="true"] .body {
          animation: none;
        }
      }
      body.reel header,
      body.reel .console,
      body.reel .caption {
        display: none;
      }
      body.reel .stage {
        grid-template-columns: 1fr;
      }
      body.reel .field {
        position: relative;
        height: 100svh;
      }
      /* GitHub README dark (#0d1117) so the GIF does not sit in a black slab. */
      body.readme,
      body.readme .field {
        background: #0d1117;
      }
    </style>
  </head>
  <body data-level="standard">
    <header>
      <a href="./">SuperDev</a>
      <a href="https://github.com/TurboVets/superdev">GitHub</a>
    </header>

    <main class="stage">
      <div class="field">
        <canvas
          id="field"
          role="img"
          aria-label="SuperDev soldier running and shipping pull requests."
        ></canvas>
        <div class="caption">
          <b id="speaker">SuperDev</b>
          <p id="line">He runs. He shoots completed PRs. Click a feature.</p>
        </div>
      </div>

      <div class="console">
        <div>
          <h1>SuperDev</h1>
          <p class="lede">
            One skill. He stays on the chat, reads the diff, and tells you what
            you are about to get. Click a feature. He opens it and ships a PR.
          </p>
        </div>

        <div class="tour">
          <button type="button" class="btn live" id="brief">Brief me</button>
          <span class="prog" id="prog">0 / 8</span>
        </div>

        <div id="features"></div>

        <section class="panel">
          <h2>Try intensity</h2>
          <div class="picks" role="group" aria-label="Sample change">
            <button
              type="button"
              class="pick"
              data-file="aria"
              aria-pressed="false"
            >
              <b>docs / aria</b><span>button.component.html</span>
            </button>
            <button
              type="button"
              class="pick"
              data-file="logic"
              aria-pressed="true"
            >
              <b>logic</b><span>claim-form.ts</span>
            </button>
            <button
              type="button"
              class="pick"
              data-file="guard"
              aria-pressed="false"
            >
              <b>authz</b><span>session.guard.ts</span>
            </button>
          </div>
          <div
            class="levels"
            role="group"
            aria-label="Intensity"
            style="margin-top: 0.45rem"
          >
            <button
              type="button"
              class="level"
              data-level="lite"
              aria-pressed="false"
            >
              <b>lite</b><span>patrol</span>
            </button>
            <button
              type="button"
              class="level"
              data-level="standard"
              aria-pressed="true"
            >
              <b>standard</b><span>advance</span>
            </button>
            <button
              type="button"
              class="level"
              data-level="full"
              aria-pressed="false"
            >
              <b>full</b><span>engage</span>
            </button>
          </div>
          <p class="why" id="why"></p>
          <ol class="orders" id="orders"></ol>
        </section>

        <div class="tour">
          <a class="btn" href="https://github.com/TurboVets/superdev">Clone</a>
          <button type="button" class="btn ghost" id="copy-hero">
            Copy install
          </button>
        </div>
        <div class="cmd">
          <code id="install"></code>
          <button type="button" id="copy">Copy</button>
        </div>
        <footer>
          <span>TurboVets</span>
          <a href="https://github.com/TurboVets/superdev">Source</a>
        </footer>
      </div>
    </main>

    <script>
      const INSTALL =
        "git clone https://github.com/TurboVets/superdev.git && ./install.sh";
      document.getElementById("install").textContent = INSTALL;

      const FEATURES = [
        {
          id: "sticky",
          title: "Sticky session",
          tag: "attach once",
          get: "You attach SuperDev once. The rest of that Agent chat stays SuperDev. You do not re-tag the skill every turn.",
          also: "Say exit SuperDev when you want a normal agent again. Until then, he keeps the pack, the intensity, and the unfinished list.",
        },
        {
          id: "boot",
          title: "Token-economy boot",
          tag: "small pack",
          get: "Each turn starts with a small context pack and a model tier, T0 through T4. He does not reread the whole skill.",
          also: "You get faster turns and a smaller bill. The full law is still there. He opens the pages he needs, not the whole binder.",
        },
        {
          id: "link",
          title: "GitHub link is intention",
          tag: "paste and go",
          get: "Paste a PR, issue, or comment URL. That is the job. SuperDev reads the stage and the remaining completion list, then continues.",
          also: "Merge still needs an explicit ask. A link is enough to start. It is not enough to ship to main.",
        },
        {
          id: "never",
          title: "Never skip",
          tag: "no early stop",
          get: "If the acceptance criteria cannot be tested, he does not write the code. A 5.5 audit is work, not a status line.",
          also: "You get a soldier who keeps going through prove and the pull request. Pretty output is not a stop condition.",
        },
        {
          id: "ladder",
          title: "L1 to L3",
          tag: "before the PR",
          get: "Before anyone else sees the branch: bundled fullstack audit, then lenses, then local bots. Lite may skip the bots.",
          also: "Nothing pushes until that scaled ladder is green. You get the review work on your machine, not as a surprise in CI.",
        },
        {
          id: "prove",
          title: "Live QA and smoke",
          tag: "integral",
          get: "6a clicks every planned case. He never posts Not covered. 6b films the result and keeps one player.",
          also: "Attaching SuperDev is enough. The team QA leaf is optional. Login stays off camera. A re-record replaces the old clip.",
        },
        {
          id: "craft",
          title: "Ponytail and own lane",
          tag: "least code",
          get: "Before the first product-code write, he names the ladder rung. Least code that works. Your ship lane is commit, push, open the PR.",
          also: "Teammate PRs stay in chat as P0 and P1. SuperDev never writes on someone else's GitHub.",
        },
        {
          id: "bars",
          title: "Review, security, reconcile",
          tag: "house law",
          get: "Review bar F1 through F11: sibling sweep, vacuous tests, transaction shape, copy density. Security bar S-1 through S-11 on auth, URLs, uploads, HTML, and PII.",
          also: "After a push, the commits beat the chat tags. If something you asked for did not land, that miss is recorded.",
        },
      ];

      const FILES = {
        aria: {
          level: "lite",
          why: "docs/CSS/aria only. The title is ignored.",
        },
        logic: {
          level: "standard",
          why: "Default logic change.",
        },
        guard: {
          level: "full",
          why: "session.guard.ts. One file can still be full.",
        },
      };
      const ORDERS = {
        lite: [
          ["L1", "One pass. Docs may skip.", "go"],
          ["L3", "Skip local bots.", "skip"],
          ["6a", "Click the one control.", "go"],
          ["6b", "Skip if aria or docs.", "skip"],
        ],
        standard: [
          ["L1", "Audit twice. Same SHA.", "go"],
          ["L3", "Local bots. Required.", "go"],
          ["6a", "Every claimed surface.", "go"],
          ["6b", "One clip. Hold it.", "go"],
        ],
        full: [
          ["L1", "Twice, then stability.", "go"],
          ["L3", "Local bots. Required.", "go"],
          ["6a", "Both parties.", "go"],
          ["6b", "Both sides. Hold both.", "go"],
        ],
      };
      const MOVE = { lite: "Patrol", standard: "Advance", full: "Engage" };

      const box = document.getElementById("features");
      const lineEl = document.getElementById("line");
      const speakerEl = document.getElementById("speaker");
      const progEl = document.getElementById("prog");
      const briefBtn = document.getElementById("brief");
      const whyEl = document.getElementById("why");
      const ordersEl = document.getElementById("orders");

      FEATURES.forEach((f, i) => {
        const wrap = document.createElement("article");
        wrap.className = "feat";
        wrap.id = "feat-" + f.id;
        wrap.innerHTML =
          "<button type='button' aria-expanded='false' data-id='" +
          f.id +
          "'>" +
          "<em>0" +
          (i + 1) +
          "</em><strong>" +
          f.title +
          "</strong><span>" +
          f.tag +
          "</span></button>" +
          "<div class='body'><p>" +
          f.get +
          "</p><p>" +
          f.also +
          "</p></div>";
        box.appendChild(wrap);
      });

      let level = "standard";
      let file = "logic";
      let openId = "";
      let briefing = false;
      let briefAt = 0;
      let briefTimer = 0;
      let prn = 1800;

      function openFeature(id) {
        openId = id;
        briefBtn.classList.remove("live");
        const feat = FEATURES.find((f) => f.id === id);
        const idx = FEATURES.findIndex((f) => f.id === id);
        document.querySelectorAll(".feat").forEach((el) => {
          const on = el.id === "feat-" + id;
          el.dataset.open = String(on);
          el.querySelector("button").setAttribute("aria-expanded", String(on));
        });
        progEl.textContent = idx + 1 + " / " + FEATURES.length;
        speakerEl.textContent = feat.title;
        lineEl.textContent = feat.get;
        firePr(feat.title);
        document
          .getElementById("feat-" + id)
          .scrollIntoView({ block: "nearest" });
      }

      function renderOrders(next) {
        ordersEl.replaceChildren(
          ...ORDERS[next].map(([code, text, kind]) => {
            const li = document.createElement("li");
            li.innerHTML =
              "<em>" +
              code +
              "</em><span>" +
              text +
              "</span><b class='" +
              kind +
              "'>" +
              (kind === "skip" ? "skip" : "run") +
              "</b>";
            return li;
          }),
        );
      }

      function setLevel(next, reason) {
        level = next;
        document.body.dataset.level = next;
        document.querySelectorAll(".level").forEach((el) => {
          el.setAttribute("aria-pressed", String(el.dataset.level === next));
        });
        whyEl.textContent = reason;
        renderOrders(next);
        speakerEl.textContent = MOVE[next];
        lineEl.textContent =
          next === "full"
            ? "Engage. Rapid fire. Every shot is a merged PR."
            : next === "lite"
              ? "Patrol. Slow walk. He still ships."
              : "Advance. He runs, plants, and ships.";
        if (next === "full") forceShoot("PR #" + (prn += 1));
      }

      function setFile(next) {
        file = next;
        document.querySelectorAll(".pick").forEach((el) => {
          el.setAttribute("aria-pressed", String(el.dataset.file === next));
        });
        const row = FILES[next];
        setLevel(row.level, row.why);
      }

      box.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-id]");
        if (!btn) return;
        briefing = false;
        clearTimeout(briefTimer);
        const id = btn.dataset.id;
        if (openId === id) {
          document.getElementById("feat-" + id).dataset.open = "false";
          btn.setAttribute("aria-expanded", "false");
          openId = "";
          speakerEl.textContent = "SuperDev";
          lineEl.textContent = "Another feature. He will open it and ship.";
          return;
        }
        openFeature(id);
      });

      document.getElementById("brief").addEventListener("click", () => {
        briefing = true;
        briefAt = 0;
        briefBtn.classList.remove("live");
        clearTimeout(briefTimer);
        const play = () => {
          if (!briefing || briefAt >= FEATURES.length) {
            briefing = false;
            speakerEl.textContent = "SuperDev";
            lineEl.textContent =
              "That is the kit. Clone it. Fill operator.yaml. Attach SuperDev.";
            forceShoot("SHIPPED");
            return;
          }
          openFeature(FEATURES[briefAt].id);
          briefAt += 1;
          briefTimer = setTimeout(play, 2200);
        };
        play();
      });

      document.querySelectorAll(".pick").forEach((el) => {
        el.addEventListener("click", () => {
          briefing = false;
          clearTimeout(briefTimer);
          setFile(el.dataset.file);
        });
      });
      document.querySelectorAll(".level").forEach((el) => {
        el.addEventListener("click", () => {
          briefing = false;
          clearTimeout(briefTimer);
          const next = el.dataset.level;
          const forced = FILES[file].level !== next;
          setLevel(
            next,
            forced
              ? "Override. The diff wanted " + FILES[file].level + "."
              : FILES[file].why,
          );
        });
      });

      addEventListener("keydown", (e) => {
        if (e.target.closest("input, textarea")) return;
        const n = Number(e.key);
        if (n >= 1 && n <= FEATURES.length) {
          briefing = false;
          clearTimeout(briefTimer);
          openFeature(FEATURES[n - 1].id);
        }
      });

      async function copyInstall(btn) {
        try {
          await navigator.clipboard.writeText(INSTALL);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = INSTALL;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        const label = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => (btn.textContent = label), 1400);
      }
      document
        .getElementById("copy")
        .addEventListener("click", (e) => copyInstall(e.currentTarget));
      document
        .getElementById("copy-hero")
        .addEventListener("click", (e) => copyInstall(e.currentTarget));
      renderOrders("standard");
      whyEl.textContent = FILES.logic.why;

      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const canvas = document.getElementById("field");
      const ctx = canvas.getContext("2d");
      let w = 0,
        h = 0,
        t = 0;

      const man = {
        x: 0.28,
        facing: 1,
        phase: 0,
        act: "run",
        actT: 0,
        recoil: 0,
        flash: 0,
        muzzle: { x: 0, y: 0 },
      };
      const prs = [];
      const dust = [];
      let shipped = 0;

      function resize() {
        const r = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = r.width;
        h = r.height;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      addEventListener("resize", resize);

      function loadImg(src) {
        const img = new Image();
        img.src = src;
        return img;
      }
      const sprites = {
        runA: loadImg("soldier-run.png"),
        runB: loadImg("soldier-run-b.png"),
        shoot: loadImg("soldier-shoot.png"),
      };

      function firePr(label) {
        forceShoot(label);
      }

      function forceShoot(label) {
        man.act = "shoot";
        man.actT = 0;
        man.recoil = 1;
        man.flash = 1;
        const n = label || "PR #" + (prn += 1);
        prs.push({
          x: man.muzzle.x || w * (man.x + 0.18 * man.facing),
          y: man.muzzle.y || h * 0.46,
          vx: (420 + Math.random() * 90) * man.facing,
          vy: -70 - Math.random() * 80,
          rot: -0.18,
          spin: 0.8 + Math.random() * 0.6,
          label: n,
          age: 0,
          land: false,
        });
        shipped += 1;
      }

      canvas.addEventListener("click", () => {
        forceShoot("PR #" + (prn += 1));
      });

      function drawPr(p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.land ? 0.92 : 1;
        ctx.fillStyle = "#f4ead4";
        ctx.strokeStyle = "#e3a85a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-52, -18, 104, 36, 6);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#1a7f4a";
        ctx.beginPath();
        ctx.roundRect(-48, -14, 28, 28, 4);
        ctx.fill();
        ctx.strokeStyle = "#f4ead4";
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(-40, 0);
        ctx.lineTo(-36, 6);
        ctx.lineTo(-26, -6);
        ctx.stroke();
        ctx.fillStyle = "#1a1208";
        ctx.font = "700 11px 'IBM Plex Mono', monospace";
        ctx.textAlign = "left";
        ctx.fillText("MERGED", -14, -2);
        ctx.font = "500 10px 'IBM Plex Mono', monospace";
        ctx.fillStyle = "#6a5a40";
        const tag = p.label.length > 14 ? p.label.slice(0, 13) + "…" : p.label;
        ctx.fillText(tag, -14, 12);
        ctx.restore();
      }

      function sprite() {
        if (man.act === "shoot") return sprites.shoot;
        return Math.sin(man.phase) > 0 ? sprites.runA : sprites.runB;
      }

      function drawSoldier() {
        const img = sprite();
        if (!img.complete || !img.naturalWidth) return;
        const shoot = man.act === "shoot";
        const s = Math.sin(man.phase);
        const ground = h * 0.78;
        const ih = Math.min(h * 0.78, w * 0.95);
        const iw = ih * (img.naturalWidth / img.naturalHeight);
        const bob = shoot
          ? 6 + man.recoil * 10
          : Math.abs(s) * (level === "full" ? 16 : 11);
        const lean = shoot ? -0.03 * man.facing : s * 0.035;

        ctx.fillStyle = "rgba(227,168,90,0.14)";
        ctx.beginPath();
        ctx.ellipse(w * man.x, ground + 8, iw * 0.28, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(w * man.x, ground - bob);
        ctx.scale(man.facing, 1);
        ctx.rotate(lean);
        ctx.drawImage(img, -iw * 0.48, -ih, iw, ih);
        if (man.flash > 0.12) {
          ctx.globalAlpha = man.flash;
          ctx.fillStyle = "#fff3c0";
          ctx.beginPath();
          ctx.moveTo(iw * 0.36, -ih * 0.58);
          ctx.lineTo(iw * 0.58, -ih * 0.7);
          ctx.lineTo(iw * 0.42, -ih * 0.56);
          ctx.lineTo(iw * 0.58, -ih * 0.42);
          ctx.closePath();
          ctx.fill();
          ctx.globalAlpha = 1;
        }
        ctx.restore();

        man.muzzle = {
          x: w * man.x + man.facing * iw * 0.34,
          y: ground - bob - ih * 0.56,
        };

        if (!shoot && !reduced && Math.abs(s) > 0.82) {
          dust.push({
            x: w * man.x - man.facing * 18,
            y: ground + 4,
            vx: -man.facing * 50,
            vy: -24,
            a: 1,
          });
        }
      }

      function step(dt) {
        const pace = level === "full" ? 2.15 : level === "lite" ? 0.7 : 1.25;
        const runGap = level === "full" ? 0.55 : level === "lite" ? 1.8 : 1.05;
        const shootFor = 0.28;
        man.actT += dt;
        man.recoil = Math.max(0, man.recoil - dt * 4.2);
        man.flash = Math.max(0, man.flash - dt * 5.5);

        if (man.act === "run") {
          man.phase += dt * (level === "full" ? 14 : level === "lite" ? 6 : 10);
          man.x += man.facing * 0.09 * pace * dt;
          if (man.x > 0.58) man.facing = -1;
          if (man.x < 0.22) man.facing = 1;
          if (man.actT > runGap) {
            man.act = "shoot";
            man.actT = 0;
            man.recoil = 1;
            man.flash = 1;
            prs.push({
              x: man.muzzle.x,
              y: man.muzzle.y,
              vx: (level === "full" ? 520 : 400) * (man.facing || 1),
              vy: -80 - Math.random() * 70,
              rot: -0.2,
              spin: 1,
              label: "PR #" + (prn += 1),
              age: 0,
              land: false,
            });
            shipped += 1;
          }
        } else if (man.actT > shootFor) {
          man.act = "run";
          man.actT = 0;
        }

        prs.forEach((p) => {
          if (p.land) return;
          p.age += dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 520 * dt;
          p.rot += p.spin * dt;
          const pileX = w * 0.78;
          const pileY = h * 0.7 - Math.min(shipped, 8) * 8;
          if (p.y > pileY && p.x > w * 0.55) {
            p.land = true;
            p.x = pileX + (Math.random() - 0.5) * 36;
            p.y = pileY;
            p.rot = (Math.random() - 0.5) * 0.35;
          }
          if (p.x > w + 80 || p.y > h + 40) p.land = true;
        });
        if (prs.length > 18) prs.splice(0, prs.length - 18);

        dust.forEach((d) => {
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.a -= dt * 2.4;
        });
        for (let i = dust.length - 1; i >= 0; i -= 1) {
          if (dust[i].a <= 0) dust.splice(i, 1);
        }
      }

      function drawHud() {
        ctx.fillStyle = "rgba(227,168,90,0.85)";
        ctx.font = "500 12px 'IBM Plex Mono', monospace";
        ctx.textAlign = "left";
        ctx.fillText(shipped + " shipped", 22, 64);
        ctx.fillStyle = "rgba(227,168,90,0.4)";
        ctx.fillText(MOVE[level], 22, 82);
      }

      function frame() {
        const dt = reduced ? 0 : 0.016;
        ctx.clearRect(0, 0, w, h);
        if (!reduced) step(dt);
        dust.forEach((d) => {
          ctx.fillStyle = "rgba(227,168,90," + d.a * 0.25 + ")";
          ctx.beginPath();
          ctx.arc(d.x, d.y, 7, 0, Math.PI * 2);
          ctx.fill();
        });
        drawSoldier();
        prs.forEach(drawPr);
        drawHud();
        if (!reduced) {
          t += dt;
          requestAnimationFrame(frame);
        }
      }
      frame();
      const qs = new URLSearchParams(location.search);
      if (qs.has("reel") || qs.has("readme")) {
        document.body.classList.add("reel");
        if (qs.has("readme")) document.body.classList.add("readme");
        resize();
        setLevel("full", FILES.guard.why);
      }
    </script>
  </body>
</html>
