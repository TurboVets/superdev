<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SuperDev</title>
    <meta name="description" content="Issue to ship. Before the PR exists." />
    <meta property="og:title" content="SuperDev" />
    <meta
      property="og:description"
      content="Issue to ship. Before the PR exists."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://superdev-mocha.vercel.app/plates/soldier-hero.png"
    />
    <link rel="icon" href="plates/soldier-mark.png" type="image/png" />
    <link rel="preload" as="image" href="plates/soldier-hero.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #050403;
        --paper: #f4ead4;
        --mute: #8a8170;
        --copper: #e3a85a;
        --hot: #ffd089;
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      html,
      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
      }
      body {
        font-family: "Instrument Serif", Georgia, serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
        opacity: 0.1;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.95rem 1.3rem;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.8rem;
        background: linear-gradient(180deg, rgba(5, 4, 3, 0.75), transparent);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
      }
      .brand img {
        width: 22px;
        height: 22px;
        object-fit: cover;
        border-radius: 50%;
      }
      header a:hover {
        color: var(--copper);
      }
      .hero {
        min-height: 100svh;
        display: grid;
        grid-template-columns: minmax(17rem, 0.9fr) 1.2fr;
        align-items: stretch;
        position: relative;
        z-index: 2;
      }
      .hero-copy {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 6rem 1.3rem 3.2rem;
      }
      h1 {
        margin: 0 0 0.45rem;
        font-weight: 400;
        font-style: italic;
        font-size: clamp(4.4rem, 11vw, 8.8rem);
        line-height: 0.78;
        letter-spacing: -0.05em;
      }
      .lede {
        margin: 0 0 1.4rem;
        color: var(--mute);
        font-size: 1.3rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.6rem;
        padding: 0 1.05rem;
        border: 0;
        background: var(--copper);
        color: #1a1208;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.82rem;
        cursor: pointer;
      }
      .btn.ghost {
        background: transparent;
        color: var(--paper);
        border: 1px solid rgba(244, 234, 212, 0.22);
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:focus-visible,
      .level:focus-visible,
      header a:focus-visible {
        outline: 2px solid var(--copper);
        outline-offset: 3px;
      }
      .soldier {
        position: relative;
        min-height: 100svh;
      }
      .soldier img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center bottom;
        filter: drop-shadow(0 0 40px rgba(227, 168, 90, 0.18));
      }
      .soldier canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .act {
        position: relative;
        min-height: 92svh;
        display: grid;
        align-content: end;
        padding: 2rem 1.3rem 3rem;
        overflow: hidden;
      }
      .act .bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        animation: ken 36s ease-in-out infinite alternate;
      }
      .act::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          transparent 40%,
          rgba(5, 4, 3, 0.88) 90%
        );
        pointer-events: none;
      }
      .act h2 {
        position: relative;
        z-index: 2;
        margin: 0;
        font-weight: 400;
        font-style: italic;
        font-size: clamp(3.2rem, 9vw, 6.8rem);
        line-height: 0.88;
        letter-spacing: -0.04em;
        text-shadow: 0 2px 28px rgba(0, 0, 0, 0.72);
      }
      .act p {
        position: relative;
        z-index: 2;
        margin: 0.5rem 0 0;
        max-width: 18ch;
        font-size: 1.25rem;
        color: #cfc3a8;
        text-shadow: 0 2px 20px rgba(0, 0, 0, 0.7);
      }
      .dial {
        width: min(1100px, calc(100% - 2.6rem));
        margin: 0 auto;
        min-height: 88svh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(220px, 320px);
        gap: 2rem;
        align-items: center;
        padding: 4rem 0;
      }
      .gauge {
        width: min(100%, 520px);
        justify-self: center;
      }
      .level {
        display: grid;
        grid-template-columns: 2rem 1fr;
        gap: 1rem;
        align-items: baseline;
        width: 100%;
        padding: 1.05rem 0;
        border: 0;
        border-top: 1px solid rgba(244, 234, 212, 0.12);
        background: none;
        color: inherit;
        text-align: left;
        cursor: pointer;
        font: inherit;
      }
      .levels .level:last-child {
        border-bottom: 1px solid rgba(244, 234, 212, 0.12);
      }
      .level i {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.68rem;
        font-style: normal;
        color: var(--mute);
      }
      .level strong {
        font-size: clamp(2.1rem, 5vw, 3.4rem);
        font-weight: 400;
        font-style: italic;
        color: #3c3830;
      }
      .level.is-on i {
        color: var(--copper);
      }
      .level.is-on strong {
        color: var(--paper);
      }
      .cmd {
        width: min(1100px, calc(100% - 2.6rem));
        margin: 0 auto 2.6rem;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        align-items: center;
        padding: 1.05rem 1.15rem;
        border: 1px solid rgba(227, 168, 90, 0.3);
        background: linear-gradient(
          90deg,
          rgba(227, 168, 90, 0.1),
          transparent 55%
        );
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: clamp(0.72rem, 1.4vw, 0.88rem);
        color: #e6d3a8;
      }
      .cmd code {
        white-space: nowrap;
        overflow-x: auto;
      }
      .cmd button {
        flex: none;
        border: 0;
        background: none;
        color: var(--copper);
        font: inherit;
        font-size: 0.75rem;
        cursor: pointer;
      }
      footer {
        width: min(1100px, calc(100% - 2.6rem));
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        padding: 0 0 2.2rem;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.75rem;
        color: var(--mute);
      }
      #gauge-needle,
      #gauge-arc {
        transition:
          transform 0.7s cubic-bezier(0.22, 1, 0.36, 1),
          stroke-dasharray 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes ken {
        to {
          transform: scale(1.04);
        }
      }
      @media (max-width: 800px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .soldier {
          min-height: 72svh;
          order: -1;
        }
        .hero-copy {
          padding: 1.2rem 1.3rem 2.4rem;
        }
        .dial {
          grid-template-columns: 1fr;
          min-height: auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .act .bg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="./">
        <img src="plates/soldier-mark.png" alt="" width="22" height="22" />
        SuperDev
      </a>
      <a href="https://github.com/TurboVets/superdev">GitHub</a>
    </header>

    <section class="hero">
      <div class="hero-copy">
        <h1>SuperDev</h1>
        <p class="lede">Ready. Before the PR exists.</p>
        <div class="actions">
          <a class="btn" href="https://github.com/TurboVets/superdev">Clone</a>
          <button type="button" class="btn ghost" id="copy-hero">
            Copy install
          </button>
        </div>
      </div>
      <div class="soldier">
        <img
          src="plates/soldier-hero.png"
          alt="SuperDev as an AI soldier, standing ready."
          width="1024"
          height="1365"
        />
        <canvas id="hud" aria-hidden="true"></canvas>
      </div>
    </section>

    <section class="act">
      <img class="bg orbit" src="plates/plate-orbit.png" alt="" />
      <h2>Sticky</h2>
      <p>One attach. The rest of the chat holds.</p>
    </section>
    <section class="act">
      <img class="bg ladder" src="plates/plate-ladder.png" alt="" />
      <h2>Ladder</h2>
      <p>L1. L2. L3. Then you push.</p>
    </section>
    <section class="act">
      <img class="bg film" src="plates/plate-film.png" alt="" />
      <h2>Prove</h2>
      <p>Click every case. Film the result.</p>
    </section>
    <section class="act">
      <img class="bg hair" src="plates/plate-filament.png" alt="" />
      <h2>Ponytail</h2>
      <p>The least code that works.</p>
    </section>
    <section class="act">
      <img class="bg seal" src="plates/plate-seal.png" alt="" />
      <h2>Own it</h2>
      <p>Your PR. Theirs stays theirs.</p>
    </section>

    <section class="dial" aria-label="Intensity">
      <svg class="gauge" viewBox="0 0 320 320" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8a6230" />
            <stop offset="1" stop-color="#ffd089" />
          </linearGradient>
        </defs>
        <circle
          cx="160"
          cy="160"
          r="122"
          stroke="#241c14"
          fill="none"
          stroke-width="22"
        />
        <circle
          id="gauge-arc"
          cx="160"
          cy="160"
          r="122"
          stroke="url(#g)"
          fill="none"
          stroke-width="22"
          stroke-linecap="round"
          stroke-dasharray="222 767"
          transform="rotate(-210 160 160)"
        />
        <line
          id="gauge-needle"
          x1="160"
          y1="160"
          x2="160"
          y2="54"
          stroke="#ffd089"
          stroke-width="2.2"
          transform-origin="160 160"
        />
        <circle cx="160" cy="160" r="5" fill="#e3a85a" />
      </svg>
      <div class="levels">
        <button type="button" class="level is-on" data-deg="-68" data-arc="150">
          <i>01</i><strong>lite</strong>
        </button>
        <button type="button" class="level" data-deg="4" data-arc="236">
          <i>02</i><strong>standard</strong>
        </button>
        <button type="button" class="level" data-deg="82" data-arc="330">
          <i>03</i><strong>full</strong>
        </button>
      </div>
    </section>

    <div class="cmd">
      <code id="install"></code>
      <button type="button" id="copy">Copy</button>
    </div>
    <footer>
      <span>TurboVets</span>
      <a href="https://github.com/TurboVets/superdev">Source</a>
    </footer>

    <script>
      const INSTALL =
        "git clone https://github.com/TurboVets/superdev.git && ./install.sh";
      document.getElementById("install").textContent = INSTALL;
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

      async function copyInstall(btn) {
        try {
          await navigator.clipboard.writeText(INSTALL);
        } catch {
          const ta = document.createElement("textarea");
          ta.value = INSTALL;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          ta.remove();
        }
        const label = btn.textContent;
        btn.textContent = "Copied";
        setTimeout(() => (btn.textContent = label), 1400);
      }
      document
        .getElementById("copy")
        .addEventListener("click", (e) => copyInstall(e.currentTarget));
      document
        .getElementById("copy-hero")
        .addEventListener("click", (e) => copyInstall(e.currentTarget));

      const needle = document.getElementById("gauge-needle");
      const arc = document.getElementById("gauge-arc");
      function setLevel(el) {
        document
          .querySelectorAll(".level")
          .forEach((n) => n.classList.remove("is-on"));
        el.classList.add("is-on");
        needle.style.transform = "rotate(" + el.dataset.deg + "deg)";
        arc.setAttribute("stroke-dasharray", el.dataset.arc + " 767");
      }
      document.querySelectorAll(".level").forEach((el) => {
        el.addEventListener("click", () => setLevel(el));
        el.addEventListener("pointerenter", () => setLevel(el));
      });

      const canvas = document.getElementById("hud");
      const ctx = canvas.getContext("2d");
      let w = 0,
        h = 0,
        t = 0;
      function resize() {
        const r = canvas.parentElement.getBoundingClientRect();
        const dpr = Math.min(devicePixelRatio || 1, 2);
        w = r.width;
        h = r.height;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      addEventListener("resize", resize);

      function frame() {
        ctx.clearRect(0, 0, w, h);
        const cx = w * 0.5;
        const cy = h * 0.42;
        const rx = Math.min(w, h) * 0.34;
        const ry = rx * 0.38;
        ctx.strokeStyle = "rgba(227,168,90,0.28)";
        ctx.lineWidth = 1;
        ctx.setLineDash([14, 12]);
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, t * 0.08, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = "rgba(255,208,137,0.75)";
        ctx.shadowColor = "#e3a85a";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, t * 0.08, t, t + 0.7);
        ctx.stroke();
        ctx.shadowBlur = 0;
        const nodes = ["0", "1", "2", "3", "4", "5", "5.5", "6a", "6b", "7"];
        nodes.forEach((label, i) => {
          const a = (i / nodes.length) * Math.PI * 2 + t * 0.08;
          const x = cx + Math.cos(a) * rx;
          const y = cy + Math.sin(a) * ry;
          ctx.fillStyle = "#e3a85a";
          ctx.beginPath();
          ctx.arc(x, y, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.font = "500 10px 'IBM Plex Mono', monospace";
          ctx.fillStyle = "rgba(244,234,212,0.55)";
          ctx.fillText(label, x + 6, y - 6);
        });
        if (!reduced) {
          t += 0.008;
          requestAnimationFrame(frame);
        }
      }
      frame();
    </script>
  </body>
</html>
